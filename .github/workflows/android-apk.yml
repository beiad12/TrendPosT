name: Build Android APK

# Builds the TrendPosT Android app (client/android/) into a debug .apk and
# uploads it as a workflow artifact. Runs on every push that touches the
# client, and on demand from the Actions tab (workflow_dispatch) — this
# sandbox has no network access to Google's Android SDK servers, so this
# is where the actual .apk gets produced, not locally in development.
on:
  push:
    branches: [main, master, "claude/**"]
    paths:
      - "client/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install web dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: client/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: trendpost-debug-apk
          path: client/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
